<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detail produk digital entertainment di STOREU.">
    <title>Detail Produk — STOREU</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='fg' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%236366f1'/><stop offset='100%25' stop-color='%23a855f7'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23fg)'/><text x='50%25' y='54%25' dominant-baseline='central' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold' font-size='18'>S</text></svg>">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="logo-icon">
                <svg width="22" height="22" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M6 8 L16 4 L26 8 L26 14 C26 21 21 27 16 28 C11 27 6 21 6 14Z" fill="currentColor" opacity="0.15"/>
                    <path d="M12 14 L15 17 L21 11" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    <path d="M6 8 L16 4 L26 8 L26 14 C26 21 21 27 16 28 C11 27 6 21 6 14Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                </svg>
            </div>
            <span>STORE<span class="text-gradient">U</span></span>
        </a>
        <ul class="navbar-nav" id="navbar-nav">
            <li><a href="/" class="nav-link"><i data-lucide="home" style="width:16px;height:16px;margin-bottom:-2px"></i> Home</a></li>
            <li><a href="/#catalog" class="nav-link"><i data-lucide="target" style="width:16px;height:16px;margin-bottom:-2px"></i> Katalog</a></li>
        </ul>
        <div class="navbar-tools">
            <button class="sound-toggle" id="sound-toggle" aria-label="Efek suara: mati" aria-pressed="false" title="Efek suara">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sound-off" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sound-on" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            </button>
            <button class="mobile-toggle" id="mobile-toggle" aria-label="Buka menu navigasi" aria-expanded="false" aria-controls="navbar-nav">☰</button>
        </div>
        <div class="nav-actions" id="nav-actions">
            <a href="/login.html" class="btn btn-secondary btn-sm">Login</a>
            <a href="/register.html" class="btn btn-primary btn-sm">Register</a>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <section class="product-detail">
                <div id="product-content">
                    <div class="page-loading"><div class="loading-spinner"></div></div>
                </div>
            </section>
        </div>
    </main>

    <script src="/js/app.js"></script>
    <script src="/js/sound.js"></script>
    <script src="/js/motion.js"></script>
    <script>
        async function loadProduct() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                window.location.href = '/';
                return;
            }

            try {
                const data = await API.get(`/api/products/${id}`);
                const p = data.product;

                document.title = `${p.name} — STOREU`;

                const finalPrice = p.discount_percentage > 0 ? Math.round(p.price - (p.price * p.discount_percentage / 100)) : p.price;
                document.getElementById('product-content').innerHTML = `
                    <nav class="breadcrumb reveal" aria-label="Breadcrumb" style="margin-bottom:22px;font-size:0.86rem;color:var(--text-muted)">
                        <a href="/" style="color:var(--text-secondary)">Home</a>
                        <span aria-hidden="true" style="margin:0 8px">/</span>
                        <a href="/#catalog" style="color:var(--text-secondary)">${p.category === 'game' ? 'Games' : p.category === 'film' ? 'Film & Series' : p.category === 'music' ? 'Musik' : 'eBook'}</a>
                        <span aria-hidden="true" style="margin:0 8px">/</span>
                        <span aria-current="page" style="color:var(--text-primary)">${p.name}</span>
                    </nav>
                    <div class="product-detail-layout">
                        <div class="glass-card product-detail-image reveal">
                            ${p.image_url ? `<img src="${p.image_url}" alt="${p.name}" loading="lazy" decoding="async" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">` : ''}
                            <div class="placeholder-img" style="${p.image_url ? 'display:none;' : ''}font-size:5rem">${getCategoryIcon(p.category)}</div>
                        </div>
                        <div class="product-detail-info reveal" data-reveal-delay="1">
                            <span class="p-tag p-tag-cat ${p.category}" style="margin-bottom:14px">${p.category === 'game' ? 'Game' : p.category === 'film' ? 'Film' : p.category === 'music' ? 'Musik' : 'eBook'}</span>
                            <h1>${p.name}</h1>
                            <div class="product-meta">
                                <span class="product-meta-item"><i data-lucide="star" style="width:14px;height:14px;color:orange;margin-bottom:-2px;fill:orange"></i> ${Number(p.rating).toFixed(1)}/5</span>
                                ${p.developer ? `<span class="product-meta-item"><i data-lucide="building-2" style="width:14px;height:14px;margin-bottom:-2px"></i> ${p.developer}</span>` : ''}
                                ${p.release_year ? `<span class="product-meta-item"><i data-lucide="calendar" style="width:14px;height:14px;margin-bottom:-2px"></i> ${p.release_year}</span>` : ''}
                                ${p.platform ? `<span class="product-meta-item"><i data-lucide="monitor" style="width:14px;height:14px;margin-bottom:-2px"></i> ${p.platform}</span>` : ''}
                            </div>
                            <div class="product-price" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
                                ${p.discount_percentage > 0 ?
                                    `<span class="p-price-old" style="font-size:1.15rem">${formatRupiah(p.price)}</span>
                                     <span class="p-price-now" style="font-size:1.9rem">${formatRupiah(finalPrice)}</span>
                                     <span class="p-tag p-tag-disc">-${p.discount_percentage}%</span>` :
                                    `<span class="p-price-now no-disc" style="font-size:1.9rem">${formatRupiah(p.price)}</span>`
                                }
                            </div>
                            <p class="product-description">${p.description}</p>

                            <div style="margin-bottom:24px">
                                <div style="display:flex;gap:24px;flex-wrap:wrap">
                                    <div>
                                        <span style="font-size:0.85rem;color:var(--text-muted)">Stok</span>
                                        <div style="font-weight:600;color:${p.stock > 10 ? 'var(--accent-green)' : 'var(--accent-orange)'}">${p.stock > 0 ? p.stock + ' tersedia' : 'Habis'}</div>
                                    </div>
                                    <div>
                                        <span style="font-size:0.85rem;color:var(--text-muted)">Platform</span>
                                        <div style="font-weight:600">${p.platform}</div>
                                    </div>
                                </div>
                            </div>

                            <div class="product-detail-actions">
                                <button class="btn btn-primary btn-lg btn-glow" data-sound="click" onclick="addToCart(${p.id}, this)" ${p.stock <= 0 ? 'disabled' : ''}>
                                    <i data-lucide="shopping-cart" style="width:18px;height:18px"></i> Tambah ke Keranjang
                                </button>
                                <button class="btn btn-ghost btn-lg" data-sound="click" onclick="buyNow(${p.id})" ${p.stock <= 0 ? 'disabled' : ''}>
                                    <i data-lucide="zap" style="width:18px;height:18px"></i> Beli Sekarang
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="reviews-section reveal" style="margin-top: 48px;">
                        <h3>Ulasan Pembeli</h3>
                        <div id="reviews-content">
                            <div class="page-loading"><div class="loading-spinner"></div></div>
                        </div>
                    </div>
                `;

                if (window.lucide) lucide.createIcons();
                if (window.StoreuMotion) StoreuMotion.initReveals(document.getElementById('product-content'));
                loadReviews(id);
            } catch (err) {
                document.getElementById('product-content').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-art" aria-hidden="true"><i data-lucide="package-search"></i></div>
                        <h3>Produk tidak ditemukan</h3>
                        <p>Produk yang kamu cari mungkin sudah dihapus</p>
                        <a href="/" class="btn btn-primary">Kembali ke Home</a>
                    </div>
                `;
            }
        }

        async function loadReviews(productId) {
            try {
                let reviews = [];
                try {
                    const data = await API.get(`/api/products/${productId}/reviews`);
                    if (data && data.reviews) reviews = data.reviews;
                } catch (apiErr) {
                    console.warn('Reviews API load note:', apiErr);
                }

                // Merge with client ReviewStore
                if (typeof ReviewStore !== 'undefined') {
                    const localRevs = ReviewStore.getByProduct(productId);
                    for (const lr of localRevs) {
                        const exists = reviews.some(r => (r.id && lr.id && r.id === lr.id) || (r.comment === lr.comment && r.rating === lr.rating));
                        if (!exists) {
                            reviews.unshift({
                                ...lr,
                                username: lr.is_anonymous ? 'A***' : (lr.username || 'Saya')
                            });
                        }
                    }
                }

                const container = document.getElementById('reviews-content');
                if (!reviews || reviews.length === 0) {
                    container.innerHTML = '<p style="color:var(--text-muted)">Belum ada ulasan untuk produk ini.</p>';
                    return;
                }
                
                let html = '<div style="display:flex;flex-direction:column;gap:15px;margin-top:15px;">';
                for (const r of reviews) {
                    const isAnon = r.is_anonymous === 1 || r.is_anonymous === true;
                    html += `
                        <div class="glass-card" style="padding:15px">
                            <div style="display:flex;justify-content:space-between;margin-bottom:8px;align-items:center">
                                <div style="display:flex;align-items:center;gap:6px">
                                    <span class="review-avatar" aria-hidden="true"><i data-lucide="user-round" style="width:18px;height:18px"></i></span>
                                    <strong>${r.username || 'User'}</strong>
                                    ${isAnon ? '<span style="font-size:0.72rem;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:4px;color:var(--text-muted)">Anonim</span>' : ''}
                                </div>
                                <span style="color:#f39c12"><i data-lucide="star" style="width:14px;height:14px;color:orange;margin-bottom:-2px;fill:orange"></i> ${r.rating}/5</span>
                            </div>
                            <p style="margin:0;color:var(--text-secondary)">${r.comment || '-'}</p>
                            <small style="color:var(--text-muted);display:block;margin-top:8px">${r.created_at ? new Date(r.created_at).toLocaleDateString('id-ID') : 'Baru saja'}</small>
                        </div>
                    `;
                }
                html += '</div>';
                container.innerHTML = html;
            } catch (err) {
                console.error('Failed to load reviews:', err);
                document.getElementById('reviews-content').innerHTML = '<p style="color:var(--text-muted)">Belum ada ulasan untuk produk ini.</p>';
            }
        }

        async function buyNow(productId) {
            await addToCart(productId);
            setTimeout(() => {
                window.location.href = '/cart.html';
            }, 500);
        }

        document.addEventListener('DOMContentLoaded', loadProduct);
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        if (window.lucide) {
            lucide.createIcons();
            // Automatically update icons when DOM changes (for dynamic content)
            const observer = new MutationObserver((mutations) => {
                let shouldUpdate = false;
                for (let m of mutations) {
                    if (m.addedNodes.length > 0) {
                        shouldUpdate = true;
                        break;
                    }
                }
                if (shouldUpdate) {
                    observer.disconnect(); // Prevent infinite loops
                    lucide.createIcons();
                    observer.observe(document.body, { childList: true, subtree: true });
                }
            });
            observer.observe(document.body, { childList: true, subtree: true });
        }
    </script>
</body>
</html>
